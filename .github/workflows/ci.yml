name: CI

on: [push, pull_request]

jobs:
  build-and-security-checks:
    name: Build, test and security scanning
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: lab/pom.xml

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-db-v1
          restore-keys: nvd-db-

      - name: Code style - Spotless (detekt analogue)
        run: mvn -B -ntp spotless:check

      - name: Build and tests
        run: mvn -B -ntp verify
      - name: SAST - SpotBugs
        run: mvn -B -ntp spotbugs:check

      - name: SCA - OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -ntp dependency-check:check -DnvdApiKey="$NVD_API_KEY"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            lab/target/spotbugs.html
            lab/target/dependency-check-report.html
            lab/target/dependency-check-report.json
          if-no-files-found: warn
